name: Monitor Twitch Changelog

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9am UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  check-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout state branch
        uses: actions/checkout@v7
        with:
          ref: state/twitch-changelog
          path: state

      - name: Check the changelog feed
        id: feed
        # Twitch's changelog RSS feed (https://dev.twitch.tv/docs/rss/change-log.xml);
        # the HTML page's layout changed in November 2026 and is not stable to scrape.
        # Entries are tracked by guid in state/.github/twitch-changelog-seen.txt.
        run: |
          python3 .github/scripts/twitch_changelog.py \
            --state state/.github/twitch-changelog-seen.txt \
            --body "$RUNNER_TEMP/new-entries.md"

      - name: Open or update the triage issue
        if: steps.feed.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CHANGELOG_URL="https://dev.twitch.tv/docs/change-log/"
          TODAY=$(date -u +%Y-%m-%d)
          ENTRIES=$(cat "$RUNNER_TEMP/new-entries.md")

          EXISTING_ISSUE=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "twitch-changelog" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Open issue #$EXISTING_ISSUE exists — adding comment"
            printf 'New changelog entries on %s:\n\n%s\n\n**Full changelog:** %s\n' \
              "$TODAY" "$ENTRIES" "$CHANGELOG_URL" > "$RUNNER_TEMP/body.md"
            gh issue comment "$EXISTING_ISSUE" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/body.md"
          else
            echo "Creating new issue"
            printf 'The Twitch API changelog has new entries.\n\n%s\n\n**Full changelog:** %s\n\n## Action needed\n- [ ] Review the new entries above for relevance to kappopher\n- [ ] Open follow-up issues for any endpoints/events needing library updates\n- [ ] Close this issue when triage is complete\n\n---\n*Automatically created by the changelog monitor workflow.*\n' \
              "$ENTRIES" "$CHANGELOG_URL" > "$RUNNER_TEMP/body.md"
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Twitch API changelog updated - ${TODAY}" \
              --label "twitch-changelog" \
              --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Save state
        working-directory: state
        run: |
          set -euo pipefail
          # The page-scrape monitor's hash and snapshot are no longer used.
          git rm -q --ignore-unmatch .github/twitch-changelog-hash .github/twitch-changelog-entries.txt
          git add .github/twitch-changelog-seen.txt
          if git diff --cached --quiet; then
            echo "State unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Twitch changelog state (seen feed entries)"
          git push
